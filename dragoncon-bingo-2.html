    padding:18px 12px 14px;
    position:relative;
  }
  h1{
    font-family:'Cinzel', serif;
    font-weight:900;
    font-size:clamp(20px, 7vw, 28px);
    letter-spacing:0.5px;
    margin:0;
    line-height:1.15;
    background:linear-gradient(180deg, #FCE9A8 0%, var(--gold) 55%, var(--gold-dark) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  h2{
    font-family:'Cinzel', serif;
    font-weight:900;
    font-size:clamp(26px, 9vw, 36px);
    letter-spacing:1px;
    margin:0;
    line-height:1.1;
    background:linear-gradient(180deg, #FCE9A8 0%, var(--gold) 55%, var(--gold-dark) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .stars{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:4px;
    color:var(--gold);
    font-size:13px;
  }
  .infobar{
    display:flex;
    justify-content:center;
    gap:8px;
    background:var(--paper);
    border-bottom:3px solid var(--gold);
    padding:8px 12px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:11px;
    color:var(--ink);
  }
  .infobar span.label{
    color:var(--gold-dark);
    margin-right:4px;
  }
  .win-banner{
    display:none;
    text-align:center;
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:18px;
    color:var(--purple-deep);
    background:var(--gold);
    padding:10px;
  }
  .win-banner.show{display:block;}
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
    background:var(--gold);
    padding:2px;
  }
  .cell{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:var(--paper);
    color:var(--ink);
    font-size:clamp(8.5px, 2.4vw, 10.5px);
    line-height:1.1;
    font-weight:600;
    padding:3px;
    cursor:pointer;
    user-select:none;
    position:relative;
    overflow:hidden;
    word-break:break-word;
    hyphens:auto;
  }

  .cell.marked{
    background:var(--gold);
    color:var(--gold-dark);
  }
  .cell.marked::after{
    content:'';
    position:absolute;
    inset:4px;
    border:2px solid var(--purple-deep);
    border-radius:6px;
    opacity:0.4;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .actions button{
    flex:1;
    padding:12px 0;
    border-radius:10px;
    border:2px solid var(--gold);
    background:var(--purple-deep);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--gold);
    cursor:pointer;
  }

    color:var(--purple-deep);
  }

</head>
<body>
<div class="wrap">
  <div class="frame">
    <header>
      <h1>Dragon Con 2026</h1>
      <h2>Bingo</h2>
      <div class="stars">&#9733; &#9733; &#9733;</div>
    </header>
    <div class="infobar">
      <div><span class="label">Card #</span><span id="cardNum">—</span></div>
    </div>
    <div class="win-banner" id="winBanner">Bingo!</div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="actions">
    <button id="newCardBtn" class="primary">New card</button>
    <button id="clearBtn">Clear marks</button>
  </div>
</div>

<script>
  const ITEMS = [
    'Utility Kilt',
    'Found Swag',
    'Inflatable T-Rex Dance Party',
    'Phone below 20%',
    'Dragoncon TV Static',
    'Celebrity Sighting Outside',
    'Bought Expensive Food',
    'Crowd Stopped at Escalator',
    'Understood Obscure Reference',
    'Location Changed',
    'Fedex John Altar',
    'Carpet Cult Sighting',
    'Too Many People!',
    'Good Spot to Sit',
    'Costume Perfection',
    'Found Waldo',
    'Wrong Hotel',
    'Too Smelly!',
    'Stopped in Skybridge',
    'Got a Table at 22 Storys',
    'Ate at Con Suite',
    'Stayed out Past 10',
    'Real Cop or Cosplay?',
    'Con Friend'
  ];
  const FREE = 'Free Space';

  function shuffled(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function randCard(){
    const picks = shuffled(ITEMS).slice(0,24);
    const card = [];
    let idx = 0;
    for(let r=0;r<5;r++){
      const row = [];
      for(let c=0;c<5;c++){
        row.push(r===2 && c===2 ? FREE : picks[idx++]);
      }
      card.push(row);
    }
    return card;
  }

  let card = randCard();
  let marked = new Set(['2-2']);

  const grid = document.getElementById('grid');
  const winBanner = document.getElementById('winBanner');
  const cardNum = document.getElementById('cardNum');

  function checkWin(){
    const M = (r,c)=> marked.has(r+'-'+c);
    for(let r=0;r<5;r++){ if([0,1,2,3,4].every(c=>M(r,c))) return true; }
    for(let c=0;c<5;c++){ if([0,1,2,3,4].every(r=>M(r,c))) return true; }
    if([0,1,2,3,4].every(i=>M(i,i))) return true;
    if([0,1,2,3,4].every(i=>M(i,4-i))) return true;
    return false;
  }

  function render(){
    grid.innerHTML = '';
    for(let r=0;r<5;r++){
      for(let c=0;c<5;c++){
        const val = card[r][c];
        const key = r+'-'+c;
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = val;
        if(val===FREE){
          cell.classList.add('free');
        } else {
          if(marked.has(key)) cell.classList.add('marked');
          cell.addEventListener('click', ()=>{
            if(marked.has(key)) marked.delete(key); else marked.add(key);
            render();
          });
        }
        grid.appendChild(cell);
      }
    }
    winBanner.classList.toggle('show', checkWin());
  }

  function newCardMeta(){
    let n = 1;
    try{
      n = parseInt(localStorage.getItem('bingoCardCount') || '0', 10) + 1;
      localStorage.setItem('bingoCardCount', String(n));
    } catch(e){
      n = 1;
    }
    cardNum.textContent = String(n);
  }

  document.getElementById('newCardBtn').addEventListener('click', ()=>{
    card = randCard();
    marked = new Set(['2-2']);
    newCardMeta();
    render();
  });
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    marked = new Set(['2-2']);
    render();
  });

  newCardMeta();
  render();
</script>
</body>
</html>
